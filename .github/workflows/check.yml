name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-and-sensitive-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify ShellCheck is available
        run: shellcheck --version
      - name: Run syntax, behavior, and sensitive-data checks
        run: ./scripts/check.sh
